# Build, test and publish Woodpecker Pipeline for the Authorization Server.

when:
  - event: push
    branch: master
    path:
      include:
        - 'oauth2-authorization-server/**'
        - '.woodpecker/authorization-server.yaml'

steps:
  - name: test
    image: eclipse-temurin:17
    commands:
      - cd oauth2-authorization-server
      - ./mvnw -B verify

    # `docker.sock` is the file used for programs to talk to Docker.
    # This makes it available to be used by Testcontainers, to create the MySQL container.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  - name: publish
    image: woodpeckerci/plugin-docker-buildx:6.1.2-insecure
    settings:
      registry: http://100.87.71.109:3000
      repo: 100.87.71.109:3000/k0st1e/authorization-server
      tags: latest
      platforms: linux/amd64,linux/arm64
      context: oauth2-authorization-server
      dockerfile: oauth2-authorization-server/Dockerfile
      insecure: true
      buildkit_config: |
        [registry."100.87.71.109:3000"]
          http = true
      username: k0st1e
      password:
        from_secret: gitea_registry_token
